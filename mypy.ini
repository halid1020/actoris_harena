# FILE: mypy.ini
#
# The four ported policies under actoris_harena/policies/{act,diffusion,pi05,
# fastwam}/ are upstream LeRobot modules moved here unchanged, and
# .pre-commit-config.yaml keeps them out of every formatter's file list for a
# stated reason: reformatting them would destroy the diff against ../lerobot that
# makes the port claim checkable.
#
# That exclude covers the FILE LIST and not the import graph. mypy follows
# imports, so the moment anything linted imports a port -- which the cropped
# variants do, being subclasses of them -- upstream's type errors surface under
# our name and `make lint` fails on code we deliberately do not own.
#
# `follow_imports = skip` treats them as Any at the boundary instead: their errors
# are not ours to fix, and fixing them is exactly what we have promised not to do.
[mypy]
ignore_missing_imports = True
explicit_package_bases = True

[mypy-actoris_harena.policies.act.*]
follow_imports = skip

[mypy-actoris_harena.policies.diffusion.*]
follow_imports = skip

[mypy-actoris_harena.policies.pi05.*]
follow_imports = skip

[mypy-actoris_harena.policies.fastwam.*]
follow_imports = skip
